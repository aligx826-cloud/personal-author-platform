name: Materialize complete author platform
on:
  push:
    branches: [main]
    paths:
      - ".source-bundle.b64"

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Replace repository root with the complete app
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .source-bundle.b64 ]]; then
            echo "Source bundle is already expanded."
            exit 0
          fi
          base64 --decode .source-bundle.b64 > /tmp/personal-author-platform.zip
          mkdir -p /tmp/author-platform
          unzip -q /tmp/personal-author-platform.zip -d /tmp/author-platform
          test -f /tmp/author-platform/personal-author-platform/package.json
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/author-platform/personal-author-platform/. .
          rm -rf /tmp/author-platform /tmp/personal-author-platform.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: publish complete Next.js author platform"
          git push
